name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task + selector (e.g. "test --tests FooTest"); empty runs the full suite'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          java-version: 8
          java-package: 'jdk'
          distribution: 'temurin'
      - uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ${{ inputs.test-filter != '' && format('jar assemble {0} -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64', inputs.test-filter) || 'jar build -x checkstyleMain -x checkstyleTest -x checkstyleRegressionTest -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64' }}
      - name: Test results summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in sorted(glob.glob('build/test-results/test/*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  total += 1
                  name = f"{tc.get('classname')}.{tc.get('name')}"
                  sk = tc.find('skipped')
                  if sk is not None:
                      skipped += 1
                      print(f"SKIPPED {name}: {sk.get('message') or 'no message'}")
                  elif tc.find('failure') is not None or tc.find('error') is not None:
                      failed += 1
                      print(f"FAILED  {name}")
                  else:
                      print(f"PASSED  {name}")
          print(f"Tests run: {total}, Passed: {total - failed - skipped}, Failures: {failed}, Skipped: {skipped}")
          EOF
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - name: Upload jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: junrar-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error

  release:
    name: semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
